name: seKKa 73-screen visual evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/scripts/collect-visual-audit.mjs'
      - 'docs/audit/INDEPENDENT_VISUAL_EVIDENCE_73.md'
      - '.github/workflows/visual-evidence-73.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-evidence-73-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci
      - name: Verify evidence script syntax
        run: node --check scripts/collect-visual-audit.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture original gallery and real unauthenticated Staging at all 584 variants
        env:
          AUDIT_BASE_URL: https://1247ab5f.sekka-staging-web.pages.dev
          AUDIT_BASE_COMMIT: 396165f42b91a58813e48c2707d8924401195780
        run: node scripts/collect-visual-audit.mjs
      - name: Bundle an accessible ZIP for offline side-by-side review
        if: always()
        run: |
          if test -d visual-audit-73; then
            zip -qr visual-audit-73.zip visual-audit-73
          else
            echo "Evidence collector never created the output directory"
          fi
      - name: Upload all evidence even if collection was incomplete
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sekka-73-screen-visual-evidence
          path: |
            web/visual-audit-73.zip
            web/visual-audit-73/index.html
            web/visual-audit-73/REPORT.md
            web/visual-audit-73/report.json
            web/visual-audit-73/metrics.csv
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
