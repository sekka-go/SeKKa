name: Subscription replacement checks
on:
  push:
    branches: [main, 'rebuild/subscriptions-*']
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:structure
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Approved passenger staging-safe smoke (360/390 AR/EN light/dark)
        run: npx playwright test e2e/v31-approved-passenger-journey.spec.ts
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-ui-evidence
          path: |
            docs/audit/*.png
            web/test-results/
