name: Subscription replacement checks
on:
  push:
    branches: [main, 'rebuild/subscriptions-*']
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:structure
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Approved passenger staging-safe smoke (360/390 AR/EN light/dark)
        run: npx playwright test e2e/v31-approved-passenger-journey.spec.ts
      - name: Validate original versus integrated geometry (S002/S003/S009/S010 and Google)
        run: npx playwright test e2e/production-shell-geometry.spec.ts e2e/production-google-login-layout.spec.ts e2e/production-guest-gates-layout.spec.ts --max-failures=1 --timeout=15000
      - name: Upload before/after geometry evidence, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sekka-original-vs-integrated-layout
          path: |
            docs/audit/layout-reference-*.png
            docs/audit/layout-after-*.png
            docs/audit/layout-gated-*.png
          if-no-files-found: warn
          retention-days: 90
      - run: npm run test:e2e
      # Browser-only auth-routing regression. Uses a non-staging fake Supabase
      # endpoint intercepted by Playwright. Never use these as real acceptance.
      - name: Build isolated fake-auth UI fixture (no staging credentials)
        env:
          VITE_SUPABASE_URL: https://sekka-auth-e2e.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-synthetic-public-key
        run: npm run build
      - name: Verify Admin landing, refresh, role denial and RPC retry (MOCKED)
        env:
          SEKKA_AUTH_UI_MOCKS: "true"
        run: npx playwright test e2e/admin-authorization-mocked.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscription-ui-evidence
          path: |
            docs/audit/*.png
            web/test-results/
