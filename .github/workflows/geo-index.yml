name: Build Greater Cairo OSM gazetteer (staging only)
on:
  workflow_dispatch:
  push:
    branches: [feat/real-app-google-auth-foundation-20261115]
    paths:
      - 'scripts/geo/**'
      - '.github/workflows/geo-index.yml'
permissions:
  contents: write
concurrency:
  group: cairo-gazetteer-staging
  cancel-in-progress: true
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STAGING_DATABASE_URL: ${{ secrets.SEKKA_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install open GIS extractor and Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool postgresql-client
      - name: Download licensed Egypt OSM extract and record its checksum
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 --max-time 900 \
            https://download.geofabrik.de/africa/egypt-latest.osm.pbf \
            --output /tmp/egypt.osm.pbf
          sha256sum /tmp/egypt.osm.pbf | tee egypt-source-sha256.txt
          test "$(stat -c%s /tmp/egypt.osm.pbf)" -gt 10000000
      - name: Clip Cairo research envelope and export OSM feature geometry
        run: |
          set -euo pipefail
          osmium extract --strategy=complete_ways \
            -b 30.15,29.50,32.20,30.70 /tmp/egypt.osm.pbf \
            -o /tmp/greater-cairo-candidate.osm.pbf --overwrite
          osmium export /tmp/greater-cairo-candidate.osm.pbf \
            --attributes=type,id -f geojsonseq \
            --format-option=print_record_separator=false \
            -o /tmp/greater-cairo-candidate.geojsonseq --overwrite
      - name: Build reproducible, sourced search index
        run: |
          set -euo pipefail
          SNAPSHOT=$(cut -d ' ' -f 1 egypt-source-sha256.txt)
          node --experimental-strip-types scripts/geo/osm-to-gazetteer.mjs \
            --input /tmp/greater-cairo-candidate.geojsonseq \
            --out geo-index --snapshot "$SNAPSHOT"
          cat geo-index/manifest.json
          test "$(wc -l < geo-index/places.tsv)" -gt 100
      - name: Build active-region CDN search shards
        run: |
          set -euo pipefail
          rm -rf web/public/geo-index
          node --experimental-strip-types scripts/geo/make-static-shards.mjs \
            geo-index web/public/geo-index
          cat web/public/geo-index/manifest.json
      - name: Commit licensed static index to existing PR branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/real-app-google-auth-foundation-20261115"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/geo-index/
          if git diff --cached --quiet; then
            echo "Static Cairo index has not changed."
          else
            git commit -m "data(geo): publish licensed OSM search shards on PR 185"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Staging-only guarded import when authorized DSN is configured
        if: env.STAGING_DATABASE_URL != ''
        run: |
          set -euo pipefail
          case "$STAGING_DATABASE_URL" in
            *zgcvumykzivsvnlflbyp*) ;;
            *) echo "ABORT: expected sekka-staging project reference" >&2; exit 1 ;;
          esac
          psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/geo/import-staging.sql
          psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "select count(*) as indexed from sekka_geo.search_places"
      - name: Explain unavailable credential without assuming import completed
        if: env.STAGING_DATABASE_URL == ''
        run: |
          echo "::warning::Licensed full OSM index generated. Staging import not executed: SEKKA_STAGING_DATABASE_URL is not configured."
          echo "Do not describe the index as deployed until an authorized staging import succeeds."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greater-cairo-osm-search-index
          path: |
            geo-index/
            egypt-source-sha256.txt
          if-no-files-found: warn
          retention-days: 14
