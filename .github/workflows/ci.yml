name: SeKKa CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/sekka-ui-rebuild
      - integration/sekka-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, tests, build, dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit

  edge:
    name: Edge Function checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check:edge
      - run: deno task test:edge

  secrets:
    name: Gitleaks history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/path"
          --workdir /path
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --no-banner --log-opts=--all /path
