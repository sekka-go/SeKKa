name: Supabase routing checks

on:
  pull_request:
    paths:
      - "supabase/functions/sekka-api/**"
      - "supabase/migrations/**"
      - "server/**"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/sekka-routing.yml"
      - "web/**"
  push:
    branches:
      - main
      - feature/google-maps-address-search
    paths:
      - "supabase/functions/sekka-api/**"
      - "supabase/migrations/**"
      - "server/**"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/sekka-routing.yml"
      - "web/**"

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Format location and routing modules
        run: deno fmt --check supabase/functions/sekka-api/locations.ts supabase/functions/sekka-api/locations_test.ts supabase/functions/sekka-api/routing.ts supabase/functions/sekka-api/routing_test.ts
      - name: Lint location and routing modules
        run: deno lint supabase/functions/sekka-api/locations.ts supabase/functions/sekka-api/locations_test.ts supabase/functions/sekka-api/routing.ts supabase/functions/sekka-api/routing_test.ts
      - name: Test location and routing helpers
        run: deno test supabase/functions/sekka-api/locations_test.ts supabase/functions/sekka-api/routing_test.ts
      - name: Type-check the Supabase Edge Function
        run: deno check supabase/functions/sekka-api/index.ts

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build the web app
        run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Build the local API server
        run: npm run build
      - name: Run the local API server tests
        run: npm test
