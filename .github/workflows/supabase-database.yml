name: Supabase database checks

on:
  pull_request:
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-database.yml"

permissions:
  contents: read

jobs:
  database:
    name: Apply migrations and run pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.0
        with:
          version: 2.122.0
      - name: Start local Supabase and apply migrations
        run: supabase start --exclude studio,mail,analytics,pooler
      - name: Run database security tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
