    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("sekka.theme");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch { /* Use the system preference when storage is unavailable. */ }
        const isDark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        const oldThemeColor = document.querySelector('meta[name="theme-color"]');
        const themeColor = document.createElement("meta");
        themeColor.name = "theme-color";
        themeColor.content = isDark ? "#0b2427" : "#f5f7fc";
        if (oldThemeColor) oldThemeColor.replaceWith(themeColor);
        else document.head.append(themeColor);
      })();
    </script>
    <title>sekka | سِكَّة</title>
