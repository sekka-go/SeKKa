<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171309" />
    <title>بدون اتصال | سِكّة</title>
    <style>
      :root { color-scheme: dark; font-family: Tahoma, Arial, sans-serif; background: #171309; color: #f3ecd9; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: radial-gradient(circle at 50% 0, rgba(255,210,31,.14), transparent 24rem), #171309; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid rgba(243,236,217,.16); border-radius: 24px; background: #242014; text-align: center; }
      img { width: 80px; height: 80px; }
      h1 { margin: 14px 0 8px; color: #ffd21f; font-size: 1.6rem; }
      p { margin: 0; color: #bcb39d; line-height: 1.8; }
      a { display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 12px; background: #ffd21f; color: #171309; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #9ee8e6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/pwa-icon-192.png" alt="" width="80" height="80" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>بيانات الحجوزات محفوظة على حسابك. اتصل بالإنترنت لعرض أحدث الرحلات أو إنشاء حجز جديد.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
