<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fc" />
    <title>بدون اتصال | sekka</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("sekka.theme");
          const theme = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          const oldThemeColor = document.querySelector('meta[name="theme-color"]');
          const themeColor = document.createElement("meta");
          themeColor.name = "theme-color";
          themeColor.content = theme === "light" ? "#f5f7fc" : "#0b2427";
          if (oldThemeColor) oldThemeColor.replaceWith(themeColor);
          else document.head.append(themeColor);
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; background: #f5f7fc; color: #112b3d; --page: #f5f7fc; --surface: #ffffff; --text: #112b3d; --muted: #4f687c; --border: #d4dfeb; --accent: #008765; --accent-text: #ffffff; }
      :root[data-theme="dark"] { color-scheme: dark; background: #0b2427; color: #f3fbf8; --page: #0b2427; --surface: #103438; --text: #f3fbf8; --muted: #bad1cc; --border: #315b5d; --accent: #19b783; --accent-text: #06251b; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: var(--text); background: radial-gradient(circle at 50% 0, color-mix(in srgb, var(--accent) 8%, transparent), transparent 24rem), var(--page); }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); text-align: center; }
      img { width: 80px; height: 80px; }
      h1 { margin: 14px 0 8px; color: var(--accent); font-size: 1.6rem; }
      p { margin: 0; color: var(--muted); line-height: 1.8; }
      a { display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #008765; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/pwa-icon-192.png" alt="" width="80" height="80" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>بيانات الحجوزات محفوظة على حسابك. اتصل بالإنترنت لعرض أحدث الرحلات أو إنشاء حجز جديد.</p>
      <a href="/">إعادة المحاولة</a>
    </main>
  </body>
</html>
